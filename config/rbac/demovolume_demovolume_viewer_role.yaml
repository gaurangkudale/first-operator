# This rule is not used by the project first-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to demovolume.gaurangkudale.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: first-operator
    app.kubernetes.io/managed-by: kustomize
  name: demovolume-demovolume-viewer-role
rules:
- apiGroups:
  - demovolume.gaurangkudale.github.io
  resources:
  - demovolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - demovolume.gaurangkudale.github.io
  resources:
  - demovolumes/status
  verbs:
  - get
