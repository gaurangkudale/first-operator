---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - demo.gaurangkudale.github.io
  resources:
  - myoperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - demo.gaurangkudale.github.io
  resources:
  - myoperators/finalizers
  verbs:
  - update
- apiGroups:
  - demo.gaurangkudale.github.io
  resources:
  - myoperators/status
  verbs:
  - get
  - patch
  - update
