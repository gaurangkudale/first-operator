# This rule is not used by the project first-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over demo.gaurangkudale.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: first-operator
    app.kubernetes.io/managed-by: kustomize
  name: myoperator-admin-role
rules:
- apiGroups:
  - demo.gaurangkudale.github.io
  resources:
  - myoperators
  verbs:
  - '*'
- apiGroups:
  - demo.gaurangkudale.github.io
  resources:
  - myoperators/status
  verbs:
  - get
